<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Servidor TeamSpeak - Sereny</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      margin: 10px;
      background: #1e90ff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .box {
      margin-top: 30px;
      padding: 20px;
      background: #222;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>Servidor TeamSpeak - Sereny</h1>

  <p>Clique abaixo para entrar no servidor:</p>

  <a class="btn" href="ts3server://sereny">Entrar no TeamSpeak</a>

  <div class="box">
    <h2>Downloads</h2>
    <p>Arquivos oficiais do servidor:</p>

    <a class="btn" href="https://google.com.br" target="_blank">
      Baixar recursos do servidor
    </a>
  </div>

  <div class="box">
    <h2>Como conectar</h2>
    <p>Abra o TeamSpeak e clique no botão acima ou use o link ts3server://sereny</p>
  </div>

</body>
</html>
